services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campushub
      POSTGRES_PASSWORD: campushub
      POSTGRES_DB: campushub
    ports:
      - "5432:5432"
    volumes:
      - campushub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campushub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  campushub_pgdata:
